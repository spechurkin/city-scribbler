<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Градописец — иконка</title>
  <desc id="desc">Круглый тёмно-зелёный план города с извилистой рекой и светлым геометрическим силуэтом зданий и дороги.</desc>
  <defs>
    <radialGradient id="ground" cx="75%" cy="18%" r="106%">
      <stop offset="0" stop-color="#234d45"/>
      <stop offset="0.42" stop-color="#10362f"/>
      <stop offset="0.81" stop-color="#082925"/>
      <stop offset="1" stop-color="#051e1c"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315b52"/>
      <stop offset="0.5" stop-color="#27544b"/>
      <stop offset="1" stop-color="#183f3a"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff9e9"/>
      <stop offset="0.55" stop-color="#f5ead5"/>
      <stop offset="1" stop-color="#e5d6ba"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="512" cy="512" r="504"/>
    </clipPath>
  </defs>
